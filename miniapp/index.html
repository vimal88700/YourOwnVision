<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#10141c">
  <title>WHAT HAPPENS?</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="/app/assets/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">YOUR OWN VISION</div>
        <h1>WHAT HAPPENS?</h1>
      </div>
      <button id="inviteBtn" class="icon-btn" type="button" aria-label="Invite a friend">＋</button>
    </header>

    <section id="statusCard" class="card status-card">
      <div class="loader"></div>
      <div>Connecting to your world…</div>
    </section>

    <section id="lobby" class="card hidden"></section>

    <section id="game" class="hidden">
      <div class="world-strip">
        <div><span class="label">DIMENSION</span><strong id="dimension">—</strong></div>
        <div><span class="label">LOCATION</span><strong id="location">—</strong></div>
        <div><span class="label">TURN</span><strong id="turn">0</strong></div>
      </div>

      <article class="card scene-card">
        <div class="scene-meta" id="sceneMeta">—</div>
        <h2 id="sceneTitle">—</h2>
        <p id="sceneText">—</p>
        <div id="npcLine" class="npc-line"></div>
      </article>

      <section id="choices" class="choices"></section>

      <section class="card stats-card">
        <div class="stats-head"><span>YOUR LIFE</span><span id="lifeText">3 chances</span></div>
        <div class="meter"><span id="healthBar"></span></div>
        <div class="stats-grid">
          <div><span>Health</span><b id="health">100</b></div>
          <div><span>Energy</span><b id="energy">100</b></div>
          <div><span>Deaths</span><b id="deaths">0</b></div>
          <div><span>Cycle</span><b id="cycle">0</b></div>
        </div>
        <div id="relationships" class="relationships"></div>
      </section>

      <section class="card history-card">
        <div class="section-title">THE WORLD REMEMBERS</div>
        <div id="discoveries" class="chips"></div>
      </section>
    </section>

    <div id="toast" class="toast hidden"></div>
  </main>
  <script src="/app/assets/app.js"></script>
</body>
</html>
