services:
  - type: web
    name: yourownvision
    runtime: python

    buildCommand: pip install -r requirements.txt
    startCommand: python main.py

    healthCheckPath: /health

    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true

      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: yourownvision
          property: host
          protocol: https

      - key: TELEGRAM_WEBHOOK_PATH
        value: /telegram/webhook

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.8-flash

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: ADMIN_USER_IDS
        sync: false

      - key: ENVIRONMENT
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: GAME_JOIN_SECONDS
        value: "45"

      - key: DEFAULT_DECISION_SECONDS
        value: "35"

      - key: MINIMUM_DECISION_SECONDS
        value: "15"

      - key: MAXIMUM_DECISION_SECONDS
        value: "900"

      - key: MINIMUM_PLAYERS
        value: "1"

      - key: MAXIMUM_PLAYERS
        value: "4"

      - key: MAX_STORY_GENERATION_ATTEMPTS
        value: "5"
