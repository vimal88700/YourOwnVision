services:
  - type: web
    name: yourownvision
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_PATH
        value: /telegram/webhook
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MINI_APP_SHORT_NAME
        value: what_happens
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
